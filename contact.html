<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - NEOGEO222</title>
    <link rel="icon" href="DJMARCI.png" type="image/png">
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Interstate', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Contenedor principal que ocupa toda la pantalla */
        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        model-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .contact-form {
            position: relative;
            z-index: 10; /* Encima del 3D */
            width: 90%;
            max-width: 450px;
            background: rgba(17, 17, 17, 0.9); /* Un poco transparente para ver el 3D */
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            backdrop-filter: blur(5px); /* Efecto de cristal */
        }

        .contact-form h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #888; }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box; /* Evita que se salga del cuadro */
        }

        .form-group input:focus, .form-group textarea:focus { border-color: #ff5500; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: white;
            border: 2px solid white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover { background: white; color: black; }

        .back-link {
            position: absolute;
            bottom: 20px;
            z-index: 100;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            border-bottom: 1px solid #555;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <model-viewer 
            src="cdj.glb" 
            alt="DJ Mixer" 
            camera-controls 
            auto-rotate 
            shadow-intensity="2" 
            exposure="1.5"
            camera-orbit="0deg 75deg 80%" 
            disable-zoom>
        </model-viewer>

        <div class="contact-form">
            <h1>BOOKING / CONTACTO / COLLABS</h1>
            
            <form action="https://formsubmit.co/NEOGEO222PROD@GMAIL.COM" method="POST">
                <div class="form-group">
                    <label>NOMBRE / PROMOTORA</label>
                    <input type="text" name="name" required>
                </div>
                
                <div class="form-group">
                    <label>EMAIL DE CONTACTO</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>MENSAJE / PROPUESTA</label>
                    <textarea name="message" rows="4" required></textarea>
                </div>

                <button type="submit" class="submit-btn">ENVIAR SOLICITUD</button>
                
                <input type="hidden" name="_next" value="https://neogeo222.xyz/contact.html">
                <input type="hidden" name="_captcha" value="false">
            </form>
        </div>

        <a href="index.html" class="back-link">← VOLVER AL PORTAFOLIO</a>
    </div>

</body>
</html>
