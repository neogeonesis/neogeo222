<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - NEOGEO222</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Interstate', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .contact-form {
            width: 100%;
            max-width: 500px;
            background: #111;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .contact-form h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #888;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #ff5500; /* Color SoundCloud */
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: white;
            border: 2px solid white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: white;
            color: black;
        }

        .back-link {
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="contact-form">
        <h1>BOOKING / CONTACT</h1>
        
        <form action="https://formsubmit.co/NEOGEO222PROD@GMAIL.COM" method="POST">
            <div class="form-group">
                <label>NOMBRE / PROMOTORA</label>
                <input type="text" name="name" required>
            </div>
            
            <div class="form-group">
                <label>EMAIL DE CONTACTO</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>FECHA DEL EVENTO / CIUDAD</label>
                <input type="text" name="subject" required>
            </div>

            <div class="form-group">
                <label>MENSAJE / PROPUESTA</label>
                <textarea name="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="submit-btn">ENVIAR SOLICITUD</button>
            
            <input type="hidden" name="_next" value="https://neogeo222.xyz/contact.html">
            <input type="hidden" name="_captcha" value="false">
        </form>
    </div>

    <a href="index.html" class="back-link">← VOLVER AL PORTAFOLIO</a>

</body>
</html>
